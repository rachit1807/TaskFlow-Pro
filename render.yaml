services:
  - type: web
    name: taskflow-pro-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start --workspace=@taskflow/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: https://taskflow-pro-web.onrender.com

  - type: web
    name: taskflow-pro-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=@taskflow/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://taskflow-pro-api-3nwo.onrender.com/api/*
